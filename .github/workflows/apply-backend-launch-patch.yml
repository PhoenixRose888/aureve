name: Apply backend launch patch

on:
  push:
    branches:
      - charlie-launch-fixes-2026-09-07

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charlie-launch-fixes-2026-09-07
          fetch-depth: 0

      - name: Apply exact backend patch
        run: python backend/charlie_launch_patch.py

      - name: Verify Python syntax
        run: python -m py_compile backend/server.py

      - name: Commit verified backend changes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git rm backend/charlie_launch_patch.py .github/workflows/apply-backend-launch-patch.yml
          git commit -m "fix: isolate demo data and correct backend wardrobe intelligence"
          git push origin HEAD:charlie-launch-fixes-2026-09-07
