name: Recovery static QA

on:
  push:
    branches:
      - recovery-implementation-2026-09-10
    paths:
      - .github/workflows/recovery-static-qa.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-implementation-2026-09-10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --ignore-scripts

      - name: TypeScript check
        run: yarn --cwd frontend tsc --noEmit

      - name: Expo lint
        run: yarn --cwd frontend lint

      - name: Remove temporary QA workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recovery-static-qa.yml
          git commit -m "chore: complete recovery static QA"
          git push origin HEAD:recovery-implementation-2026-09-10

# retry 2: lockfile is stale in the exported Emergent snapshot; install may refresh runner copy for QA only
