name: Fix TypeScript colour token errors

on:
  push:
    branches:
      - charlie-launch-fixes-2026-09-07
    paths:
      - .github/workflows/fix-typescript-errors.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charlie-launch-fixes-2026-09-07
      - name: Fix invalid colour tokens and lint warning
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('frontend/app/(tabs)/wardrobe.tsx'),
              Path('frontend/app/item/[id].tsx'),
              Path('frontend/app/looks.tsx'),
          ]
          total = 0
          for p in files:
              text = p.read_text()
              n = text.count('colors.onError')
              if n:
                  text = text.replace('colors.onError', 'colors.onSurfaceInverse')
                  p.write_text(text)
                  total += n
          if total != 4:
              raise SystemExit(f'Expected 4 invalid color-token references, fixed {total}')

          p = Path('frontend/app/(tabs)/wardrobe.tsx')
          text = p.read_text()
          old = '[load, profileLoading, active?.id]'
          if old not in text:
              raise SystemExit('Expected wardrobe dependency list not found')
          p.write_text(text.replace(old, '[load, profileLoading]', 1))
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          yarn install --ignore-scripts
          yarn lint
          yarn tsc --noEmit
      - name: Commit verified fixes and remove temporary workflow
        run: |
          rm .github/workflows/fix-typescript-errors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/workflows/fix-typescript-errors.yml
          git commit -m "fix: resolve frontend TypeScript errors"
          git push origin HEAD:charlie-launch-fixes-2026-09-07
