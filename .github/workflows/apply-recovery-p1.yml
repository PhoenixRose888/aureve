name: Apply P1 recovery patch

on:
  push:
    branches:
      - recovery-implementation-2026-09-10
    paths:
      - .github/workflows/apply-recovery-p1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-implementation-2026-09-10
          fetch-depth: 0

      - name: Apply exact P1 recovery patch
        run: python backend/recovery_p1_patch.py

      - name: Verify backend syntax
        run: python -m py_compile backend/server.py

      - name: Commit patched source and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git rm backend/recovery_p1_patch.py .github/workflows/apply-recovery-p1.yml
          git commit -m "fix: restore demo isolation and remove value stats"
          git push origin HEAD:recovery-implementation-2026-09-10
