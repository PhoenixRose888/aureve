name: Apply final QA backend patch

on:
  push:
    branches:
      - charlie-launch-fixes-2026-09-07
    paths:
      - .github/workflows/apply-final-qa-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: charlie-launch-fixes-2026-09-07
          fetch-depth: 0

      - name: Apply final QA patch
        run: python backend/charlie_qa_patch.py

      - name: Verify Python syntax
        run: python -m py_compile backend/server.py

      - name: Commit verified backend changes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          git rm backend/charlie_qa_patch.py .github/workflows/apply-final-qa-patch.yml
          git commit -m "fix: final QA for Dress Me and demo isolation"
          git push origin HEAD:charlie-launch-fixes-2026-09-07
